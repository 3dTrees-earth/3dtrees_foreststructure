name: Test and publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Historical Git ref to publish after verifying runtime-source equivalence
        required: false
        default: ""
      release_tag:
        description: Optional explicit image tag for a manual release
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/3dtrees-earth/3dtrees-foreststructure
  FORESTSTRUCTURE_CPUS: "4"
  FORESTSTRUCTURE_MEMORY: 12g

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify historical runtime source
        if: ${{ inputs.source_ref != '' }}
        run: git diff --exit-code "${{ inputs.source_ref }}" -- Dockerfile Makefile src

      - name: Run container acceptance suite
        run: make test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Resolve source revision
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          if [[ -n "$RELEASE_TAG" ]]; then
            image_version="$RELEASE_TAG"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            image_version="$GITHUB_REF_NAME"
          else
            image_version="sha-$short_sha"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            ${{ steps.metadata.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.image_version }}
          build-args: |
            VCS_REF=${{ steps.source.outputs.sha }}
            IMAGE_VERSION=${{ steps.source.outputs.image_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
