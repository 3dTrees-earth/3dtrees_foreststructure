name: 3dtrees_foreststructure
owner: bgruening
description: Forest-structure metrics, terrain and canopy models and voxel point counts from segmented point clouds.
homepage_url: https://github.com/3dTrees-earth/3dtrees_foreststructure
long_description: |
  Computes fixed 20 m tile metrics of forest structure from one segmented
  LAS/LAZ or COPC point cloud, with optional area of interest and statistical
  outlier removal. Also writes a DTM, a CHM, full-resolution 0.5 m voxel point
  counts and provenance records.
remote_repository_url: https://github.com/3dTrees-earth/3dtrees_foreststructure/tree/main/galaxy/3dtrees_foreststructure
type: unrestricted
categories:
- "Geo Science"
